[package]
name = "ai-proxy"
version = "0.1.0"
edition = "2021"
authors = ["Petitan"]
license = "MIT"
description = "AI Proxy — unified routing layer for local and remote AI backends"

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
http-body = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "catch-panic"] }

# HTTP client (backend felé)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"

# Config
toml = "0.8"
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Security
subtle = "2"

# Concurrency
parking_lot = "0.12"

# VRAM monitoring
nvml-wrapper = "0.10"

# SSE streaming
async-stream = "0.3"
bytes = "1"
tokio-stream = "0.1"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "ai-proxy"
path = "src/main.rs"
